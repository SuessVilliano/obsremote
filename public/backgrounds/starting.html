<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#070912;color:#fff;font-family:Arial,Helvetica,sans-serif}body{display:grid;place-items:center;background:radial-gradient(circle at 25% 20%,#4d2bb955,transparent 32%),radial-gradient(circle at 80% 70%,#0077aa44,transparent 30%),linear-gradient(135deg,#070912,#11172a)}.grid{position:absolute;inset:0;background-image:linear-gradient(#ffffff0b 1px,transparent 1px),linear-gradient(90deg,#ffffff0b 1px,transparent 1px);background-size:48px 48px;mask-image:linear-gradient(to bottom,transparent,#000,transparent);animation:drift 18s linear infinite}.orb{position:absolute;width:420px;height:420px;border-radius:50%;filter:blur(80px);background:#6b4cff33;animation:pulse 6s ease-in-out infinite}.card{z-index:2;text-align:center;padding:44px 60px;border:1px solid #ffffff1c;border-radius:32px;background:#0c1120bb;box-shadow:0 30px 90px #0008;backdrop-filter:blur(20px)}.eyebrow{letter-spacing:.35em;font-weight:700;color:#9aa7c5;font-size:18px}.title{font-size:88px;line-height:.95;margin:18px 0 14px;font-weight:900;letter-spacing:-.05em}.sub{font-size:24px;color:#aeb8cd}.bar{width:360px;height:6px;border-radius:999px;background:#ffffff14;margin:28px auto 0;overflow:hidden}.bar:after{content:"";display:block;width:45%;height:100%;background:linear-gradient(90deg,#7a5cff,#36d1dc);animation:load 2.8s ease-in-out infinite}@keyframes drift{to{background-position:96px 48px}}@keyframes pulse{50%{transform:scale(1.25);opacity:.7}}@keyframes load{0%{transform:translateX(-120%)}100%{transform:translateX(330%)}}</style></head><body><div class="grid"></div><div class="orb"></div><div class="card"><div class="eyebrow">LIVE COMMAND CENTER</div><div class="title">STARTING<br>SOON</div><div class="sub">Getting everything dialed in.</div><div class="bar"></div></div></body></html>
