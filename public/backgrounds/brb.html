<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#06080d;color:#fff;font-family:Arial,Helvetica,sans-serif}body{display:grid;place-items:center;background:radial-gradient(circle at 70% 25%,#00a8a844,transparent 30%),radial-gradient(circle at 25% 75%,#704cff44,transparent 34%),#070b12}.ring{position:absolute;width:620px;height:620px;border-radius:50%;border:2px solid #7f66ff33;box-shadow:0 0 90px #5b43ff22 inset;animation:spin 18s linear infinite}.ring:before,.ring:after{content:"";position:absolute;border-radius:50%;inset:70px;border:1px dashed #37d7d733}.ring:after{inset:145px;border-style:solid;border-color:#ffffff12}.copy{z-index:2;text-align:center}.small{font-size:18px;letter-spacing:.4em;color:#90a0bc;font-weight:700}.big{font-size:120px;font-weight:900;letter-spacing:-.06em;margin:12px 0}.sub{font-size:26px;color:#b4bfd0}@keyframes spin{to{transform:rotate(360deg)}}</style></head><body><div class="ring"></div><div class="copy"><div class="small">STAY RIGHT THERE</div><div class="big">BRB</div><div class="sub">Back in a minute.</div></div></body></html>
