<!doctype html><html><head><meta charset="utf-8"><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#050814;font-family:Arial,sans-serif}.scene{position:relative;width:100vw;height:100vh;background:radial-gradient(circle at 72% 36%,rgba(120,70,255,.28),transparent 26%),radial-gradient(circle at 24% 66%,rgba(0,220,255,.2),transparent 30%),linear-gradient(135deg,#03050c,#091027 45%,#080517)}.grid{position:absolute;inset:0;background-image:linear-gradient(rgba(79,122,255,.06) 1px,transparent 1px),linear-gradient(90deg,rgba(79,122,255,.06) 1px,transparent 1px);background-size:72px 72px;perspective:800px}.rail{position:absolute;left:4%;top:10%;bottom:10%;width:8px;background:#25d9ff;box-shadow:0 0 32px #25d9ff}.rail.r{left:auto;right:4%;background:#8d5cff;box-shadow:0 0 32px #8d5cff}.panel{position:absolute;border:1px solid rgba(99,195,255,.35);background:rgba(11,25,57,.48);box-shadow:0 0 30px rgba(0,160,255,.14);border-radius:24px;backdrop-filter:blur(10px)}.p1{left:8%;top:12%;width:30%;height:28%}.p2{left:10%;bottom:12%;width:25%;height:26%}.p3{right:8%;top:18%;width:22%;height:22%}.line{height:3px;background:linear-gradient(90deg,#27e1ff,#8e5cff);margin:26px;border-radius:3px;box-shadow:0 0 18px rgba(65,204,255,.5)}.line:nth-child(2){width:55%}.line:nth-child(3){width:74%}.orb{position:absolute;right:13%;bottom:16%;width:170px;height:170px;border:2px solid #8d5cff;border-radius:50%;box-shadow:0 0 55px rgba(141,92,255,.5),inset 0 0 50px rgba(0,210,255,.25);animation:pulse 3s ease-in-out infinite}.orb:before,.orb:after{content:"";position:absolute;inset:24px;border:1px solid #29dcff;border-radius:50%}.orb:after{inset:52px}@keyframes pulse{50%{transform:scale(1.06);filter:brightness(1.2)}}.floor{position:absolute;left:0;right:0;bottom:0;height:20%;background:linear-gradient(180deg,transparent,rgba(15,25,60,.8));border-top:1px solid rgba(76,154,255,.22)}</style></head><body><div class="scene"><div class="grid"></div><div class="rail"></div><div class="rail r"></div><div class="panel p1"><div class="line"></div><div class="line"></div><div class="line"></div></div><div class="panel p2"><div class="line"></div><div class="line"></div><div class="line"></div></div><div class="panel p3"><div class="line"></div><div class="line"></div></div><div class="orb"></div><div class="floor"></div></div></body></html>
