<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#070a10;color:#fff;font-family:Arial,Helvetica,sans-serif}body{background:radial-gradient(circle at 18% 28%,#6d4cff22,transparent 28%),radial-gradient(circle at 85% 22%,#00b7c722,transparent 26%),linear-gradient(135deg,#080b12,#111726)}.frame{position:absolute;inset:5%;border:1px solid #ffffff10;border-radius:40px;box-shadow:inset 0 0 80px #0008}.shelf{position:absolute;left:6%;top:12%;width:28%;height:76%;border-left:3px solid #7a5cff66;background:linear-gradient(90deg,#111826cc,transparent)}.shelf:before,.shelf:after{content:"";position:absolute;left:28px;right:30px;height:1px;background:#ffffff14;box-shadow:0 160px #ffffff14,0 320px #ffffff14,0 480px #ffffff14}.lights{position:absolute;right:7%;top:16%;display:flex;gap:18px}.lights i{display:block;width:8px;height:340px;border-radius:8px;background:linear-gradient(#52d8ff,#755cff);box-shadow:0 0 24px #52d8ff55}.lights i:nth-child(2){height:250px;margin-top:70px}.lights i:nth-child(3){height:420px;margin-top:20px}.center{position:absolute;left:39%;right:28%;top:20%;bottom:18%;border-radius:32px;background:linear-gradient(180deg,#111725cc,#0d121bcc);border:1px solid #ffffff0b;box-shadow:0 30px 80px #0006}.center:after{content:"LIVE STUDIO";position:absolute;left:34px;bottom:28px;color:#ffffff22;font-size:54px;font-weight:900;letter-spacing:.05em}.glow{position:absolute;inset:auto 20% 8% 20%;height:8px;border-radius:50%;background:#6b55ff55;filter:blur(10px);animation:pulse 4s ease-in-out infinite}@keyframes pulse{50%{opacity:.35;transform:scaleX(.8)}}</style></head><body><div class="frame"></div><div class="shelf"></div><div class="center"></div><div class="lights"><i></i><i></i><i></i></div><div class="glow"></div></body></html>
