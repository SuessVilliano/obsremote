<!doctype html><html><head><meta charset="utf-8"><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#151515}.room{position:relative;width:100vw;height:100vh;background:linear-gradient(90deg,#151515 0 22%,#242424 22% 73%,#171717 73%)}.wallGlow{position:absolute;left:28%;top:8%;width:44%;height:62%;background:radial-gradient(ellipse at center,rgba(255,212,160,.11),transparent 68%)}.shelf{position:absolute;left:4%;top:14%;width:16%;height:58%;border-left:12px solid #0f0f0f;border-right:12px solid #0f0f0f;display:flex;flex-direction:column;justify-content:space-around}.shelf i{height:9px;background:#0d0d0d;box-shadow:0 -9px 22px rgba(255,181,99,.16)}.plant{position:absolute;right:7%;bottom:14%;width:180px;height:360px}.plant:before{content:"";position:absolute;bottom:0;left:52px;width:85px;height:100px;background:#111;border-radius:12px 12px 28px 28px}.leaf{position:absolute;bottom:75px;left:85px;width:28px;height:180px;background:linear-gradient(#304d37,#14261b);border-radius:100% 0 100% 0;transform-origin:bottom}.leaf:nth-child(1){transform:rotate(-42deg)}.leaf:nth-child(2){transform:rotate(-18deg);height:220px}.leaf:nth-child(3){transform:rotate(14deg);height:235px}.leaf:nth-child(4){transform:rotate(43deg);height:190px}.lamp{position:absolute;right:17%;top:19%;width:4px;height:280px;background:#111}.lamp:before{content:"";position:absolute;left:-55px;top:-8px;width:115px;height:115px;border-radius:50%;background:radial-gradient(circle,#ffe6bd 0 10%,#f5b76b 11% 14%,rgba(245,183,107,.18) 15% 45%,transparent 60%);filter:blur(.2px)}.floor{position:absolute;left:0;right:0;bottom:0;height:28%;background:repeating-linear-gradient(90deg,#181513 0 130px,#211d1a 131px 134px);box-shadow:inset 0 16px 45px rgba(0,0,0,.5)}.art{position:absolute;left:48%;top:20%;width:170px;height:240px;border:10px solid #111;background:linear-gradient(155deg,#2d2a28,#101010);box-shadow:0 12px 36px rgba(0,0,0,.3)}.art:after{content:"";position:absolute;inset:35px;background:linear-gradient(145deg,transparent 45%,rgba(223,182,134,.3) 46% 49%,transparent 50%)}</style></head><body><div class="room"><div class="wallGlow"></div><div class="shelf"><i></i><i></i><i></i><i></i></div><div class="art"></div><div class="lamp"></div><div class="plant"><b class="leaf"></b><b class="leaf"></b><b class="leaf"></b><b class="leaf"></b></div><div class="floor"></div></div></body></html>
