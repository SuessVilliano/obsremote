<!doctype html><html><body style="margin:0;background:transparent"><audio id="a" preload="auto"></audio><script>const a=document.getElementById('a');let state={},track=null;const ws=new WebSocket((location.protocol==='https:'?'wss':'ws')+'://'+location.host+'/music-player');function apply(m){state=m.state||state;track=m.track||track;if(track&&a.dataset.id!==track.id){a.dataset.id=track.id;a.src='/uploads/music/'+encodeURIComponent(track.filename);a.currentTime=Number(state.position||0)}a.volume=Math.max(0,Math.min(1,Number(state.volume??25)/100));if(state.playing&&a.paused)a.play().catch(()=>{});if(!state.playing&&!a.paused)a.pause()}ws.onmessage=e=>{try{const m=JSON.parse(e.data);if(m.type==='state')apply(m)}catch{}};a.onended=()=>ws.readyState===1&&ws.send(JSON.stringify({type:'ended'}));setInterval(()=>{if(ws.readyState===1&&track)ws.send(JSON.stringify({type:'progress',position:a.currentTime||0,duration:a.duration||0,playing:!a.paused}))},1000);</script></body></html>
