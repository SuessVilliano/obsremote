<!doctype html><html><head><meta charset="utf-8"><meta name="robots" content="noindex"><style>html,body{margin:0;background:transparent;overflow:hidden}</style></head><body><audio id="audio" preload="auto"></audio><script>
const audio=document.getElementById('audio'),token=new URLSearchParams(location.search).get('token')||'';let socket,retry,attempt=0,lastState={},track=null,lastProgress=0;
function wsUrl(){return `${location.protocol==='https:'?'wss':'ws'}://${location.host}/music-player?token=${encodeURIComponent(token)}`}
function apply(message){lastState=message.state||lastState;track=message.track||null;if(track?.url&&audio.dataset.id!==track.id){audio.dataset.id=track.id;audio.src=track.url;audio.load();const seek=()=>{try{if(Number.isFinite(audio.duration))audio.currentTime=Math.min(Math.max(0,Number(lastState.position)||0),Math.max(0,audio.duration-.05))}catch{}};audio.addEventListener('loadedmetadata',seek,{once:true})}audio.volume=Math.max(0,Math.min(1,Number(lastState.volume??25)/100));if(lastState.playing){const p=audio.play();if(p?.catch)p.catch(()=>{})}else if(!audio.paused)audio.pause()}
function connect(){clearTimeout(retry);try{socket?.close()}catch{}socket=new WebSocket(wsUrl());socket.onopen=()=>attempt=0;socket.onmessage=e=>{try{const m=JSON.parse(e.data);if(m.type==='state')apply(m)}catch{}};socket.onclose=()=>{attempt++;retry=setTimeout(connect,Math.min(10000,600*Math.pow(1.7,attempt)))};socket.onerror=()=>{try{socket.close()}catch{}}}connect();
audio.onended=()=>socket?.readyState===1&&socket.send(JSON.stringify({type:'ended'}));setInterval(()=>{if(socket?.readyState!==1||!track)return;const now=Date.now();if(now-lastProgress<900)return;lastProgress=now;socket.send(JSON.stringify({type:'progress',position:Number(audio.currentTime||0),duration:Number.isFinite(audio.duration)?audio.duration:0,playing:!audio.paused&&!audio.ended}))},1000);
</script></body></html>
