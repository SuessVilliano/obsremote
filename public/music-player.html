<!doctype html><html><head><meta charset="utf-8"><meta name="robots" content="noindex"><style>html,body{margin:0;background:transparent;overflow:hidden}</style></head><body><audio id="audio" preload="auto"></audio><script>
const audio=document.getElementById('audio'),token=new URLSearchParams(location.search).get('token')||'';let socket,retry,attempt=0,lastState={},track=null,lastProgress=0,tickTimer=null,endSent=false;
function wsUrl(){return `${location.protocol==='https:'?'wss':'ws'}://${location.host}/music-player?token=${encodeURIComponent(token)}`}
function clip(){const start=Math.max(0,Number(track?.clipStart)||0),rawEnd=track?.clipEnd,end=rawEnd==null?null:Math.max(start+.05,Number(rawEnd)||0),fadeIn=Math.max(0,Number(track?.fadeIn)||0),fadeOut=Math.max(0,Number(track?.fadeOut)||0);return{start,end,fadeIn,fadeOut}}
function baseVolume(){return Math.max(0,Math.min(1,Number(lastState.volume??25)/100))}
function applyGain(){if(!track)return;const{start,end,fadeIn,fadeOut}=clip(),t=Number(audio.currentTime)||0,stop=end??(Number.isFinite(audio.duration)?audio.duration:null);let gain=1;if(fadeIn>0&&t<start+fadeIn)gain=Math.min(gain,Math.max(0,Math.min(1,(t-start)/fadeIn)));if(stop!==null&&fadeOut>0&&t>stop-fadeOut)gain=Math.min(gain,Math.max(0,Math.min(1,(stop-t)/fadeOut)));audio.volume=baseVolume()*gain;if(stop!==null&&t>=stop-.015&&!endSent){endSent=true;audio.pause();if(socket?.readyState===1)socket.send(JSON.stringify({type:'ended'}))}}
function ensureTick(){if(tickTimer)return;tickTimer=setInterval(()=>{applyGain();sendProgress()},50)}
function apply(message){lastState=message.state||lastState;track=message.track||null;if(track?.url&&audio.dataset.id!==track.id){audio.dataset.id=track.id;audio.src=track.url;audio.load();endSent=false;const seek=()=>{const{start,end}=clip(),saved=Math.max(0,Number(lastState.position)||0),target=saved>0?saved:start,limit=end??(Number.isFinite(audio.duration)?audio.duration:null);try{audio.currentTime=limit===null?Math.max(start,target):Math.min(Math.max(start,target),Math.max(start,limit-.05))}catch{}applyGain()};audio.addEventListener('loadedmetadata',seek,{once:true})}if(!track){audio.pause();audio.removeAttribute('src');audio.load();return}const{start,end}=clip();if(!lastState.playing){if(!audio.paused)audio.pause();if((Number(lastState.position)||0)===0&&Number.isFinite(audio.duration)){try{audio.currentTime=Math.min(start,Math.max(0,audio.duration-.02))}catch{}}applyGain();return}if(end!==null&&audio.currentTime>=end-.02){try{audio.currentTime=start}catch{}endSent=false}const p=audio.play();if(p?.catch)p.catch(()=>{});ensureTick();applyGain()}
function connect(){clearTimeout(retry);try{socket?.close()}catch{}socket=new WebSocket(wsUrl());socket.onopen=()=>attempt=0;socket.onmessage=e=>{try{const m=JSON.parse(e.data);if(m.type==='state')apply(m)}catch{}};socket.onclose=()=>{attempt++;retry=setTimeout(connect,Math.min(10000,600*Math.pow(1.7,attempt)))};socket.onerror=()=>{try{socket.close()}catch{}}}connect();
function sendProgress(){if(socket?.readyState!==1||!track)return;const now=Date.now();if(now-lastProgress<900)return;lastProgress=now;socket.send(JSON.stringify({type:'progress',position:Number(audio.currentTime||0),duration:Number.isFinite(audio.duration)?audio.duration:0,playing:!audio.paused&&!audio.ended}))}
audio.onended=()=>{if(endSent)return;endSent=true;socket?.readyState===1&&socket.send(JSON.stringify({type:'ended'}))};audio.onplay=()=>{endSent=false;ensureTick()};window.addEventListener('beforeunload',()=>{if(tickTimer)clearInterval(tickTimer)});
</script></body></html>
