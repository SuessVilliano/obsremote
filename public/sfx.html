<!doctype html><html><head><meta charset="utf-8"><style>html,body{margin:0;background:transparent;overflow:hidden}</style></head><body><script>
const q=new URLSearchParams(location.search);const sound=q.get('sound')||'success';
const C=window.AudioContext||window.webkitAudioContext;const ctx=new C();
function tone(freq,start,duration,type='sine',gain=.18,endFreq=null){const o=ctx.createOscillator(),g=ctx.createGain();o.type=type;o.frequency.setValueAtTime(freq,ctx.currentTime+start);if(endFreq)o.frequency.exponentialRampToValueAtTime(endFreq,ctx.currentTime+start+duration);g.gain.setValueAtTime(.0001,ctx.currentTime+start);g.gain.exponentialRampToValueAtTime(gain,ctx.currentTime+start+.015);g.gain.exponentialRampToValueAtTime(.0001,ctx.currentTime+start+duration);o.connect(g).connect(ctx.destination);o.start(ctx.currentTime+start);o.stop(ctx.currentTime+start+duration+.03)}
function noise(start,duration,gain=.08){const len=Math.floor(ctx.sampleRate*duration),buf=ctx.createBuffer(1,len,ctx.sampleRate),d=buf.getChannelData(0);for(let i=0;i<len;i++)d[i]=Math.random()*2-1;const s=ctx.createBufferSource(),g=ctx.createGain(),f=ctx.createBiquadFilter();s.buffer=buf;f.type='highpass';f.frequency.value=900;g.gain.setValueAtTime(gain,ctx.currentTime+start);g.gain.exponentialRampToValueAtTime(.0001,ctx.currentTime+start+duration);s.connect(f).connect(g).connect(ctx.destination);s.start(ctx.currentTime+start)}
(async()=>{try{await ctx.resume()}catch{};if(sound==='success'){tone(523,.02,.18,'sine',.16);tone(659,.18,.18,'sine',.16);tone(784,.34,.28,'sine',.19)}else if(sound==='alert'){tone(880,.02,.17,'square',.09);tone(660,.22,.17,'square',.08);tone(880,.42,.24,'square',.1)}else if(sound==='swoosh'){noise(.02,.5,.12);tone(180,.02,.48,'sine',.08,900)}else if(sound==='hype'){tone(110,.01,.22,'sawtooth',.12,220);tone(220,.18,.24,'sawtooth',.12,440);tone(440,.38,.3,'sawtooth',.13,880);noise(.38,.35,.06)}else{tone(480,.02,.09,'sine',.13);tone(720,.11,.12,'sine',.12)}})();
setTimeout(()=>ctx.close().catch(()=>{}),1800);
</script></body></html>
