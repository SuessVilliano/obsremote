<!doctype html><html><head><meta charset="utf-8"><meta name="robots" content="noindex"><style>html,body{margin:0;background:transparent;overflow:hidden}</style></head><body><script>
const params=new URLSearchParams(location.search),token=params.get('token')||'';let socket,retry,attempt=0,active=new Set();
function wsUrl(){return `${location.protocol==='https:'?'wss':'ws'}://${location.host}/sound-player?token=${encodeURIComponent(token)}`}
function connect(){clearTimeout(retry);try{socket?.close()}catch{}socket=new WebSocket(wsUrl());socket.onopen=()=>attempt=0;socket.onmessage=async e=>{try{const m=JSON.parse(e.data);if(m.type!=='play'||!m.sound?.url)return;const audio=new Audio(m.sound.url);audio.preload='auto';active.add(audio);audio.onended=audio.onerror=()=>active.delete(audio);await audio.play()}catch{}};socket.onclose=()=>{attempt++;retry=setTimeout(connect,Math.min(10000,600*Math.pow(1.7,attempt)))};socket.onerror=()=>{try{socket.close()}catch{}}}connect();
</script></body></html>
