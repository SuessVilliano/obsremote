<!doctype html><html><head><meta charset="utf-8"><meta name="robots" content="noindex"><style>html,body{margin:0;background:transparent;overflow:hidden}</style></head><body><script>
const params=new URLSearchParams(location.search),token=params.get('token')||'';let socket,retry,attempt=0,active=new Map();
function wsUrl(){return `${location.protocol==='https:'?'wss':'ws'}://${location.host}/sound-player?token=${encodeURIComponent(token)}`}
function cleanup(id,a){try{a.pause();a.src=''}catch{}active.delete(id)}
function stopAll(){for(const[id,a]of active)cleanup(id,a)}
function playSound(sound){const id=String(sound.id||crypto.randomUUID?.()||Date.now());if(active.has(id))cleanup(id,active.get(id));const a=new Audio(sound.url);a.preload='auto';active.set(id,a);const start=Math.max(0,Number(sound.clipStart)||0),configuredEnd=sound.clipEnd==null?null:Math.max(start+.05,Number(sound.clipEnd)||0),fadeIn=Math.max(0,Number(sound.fadeIn)||0),fadeOut=Math.max(0,Number(sound.fadeOut)||0);let end=configuredEnd,timer=null;const setGain=()=>{const t=Number(a.currentTime)||0,stop=end??(Number.isFinite(a.duration)?a.duration:null);if(stop!==null&&t>=stop-.015){cleanup(id,a);if(timer)clearInterval(timer);return}let gain=1;if(fadeIn>0&&t<start+fadeIn)gain=Math.min(gain,Math.max(0,Math.min(1,(t-start)/fadeIn)));if(stop!==null&&fadeOut>0&&t>stop-fadeOut)gain=Math.min(gain,Math.max(0,Math.min(1,(stop-t)/fadeOut)));a.volume=gain};a.addEventListener('loadedmetadata',()=>{if(end===null&&Number.isFinite(a.duration))end=a.duration;a.currentTime=Math.min(start,Math.max(0,(a.duration||start)-.02));setGain();a.play().catch(()=>{});timer=setInterval(setGain,30)},{once:true});a.onended=a.onerror=()=>{if(timer)clearInterval(timer);cleanup(id,a)}}
function connect(){clearTimeout(retry);try{socket?.close()}catch{}socket=new WebSocket(wsUrl());socket.onopen=()=>attempt=0;socket.onmessage=e=>{try{const m=JSON.parse(e.data);if(m.type==='play'&&m.sound?.url)playSound(m.sound);if(m.type==='stop'){if(m.soundId&&active.has(String(m.soundId)))cleanup(String(m.soundId),active.get(String(m.soundId)));else stopAll()}}catch{}};socket.onclose=()=>{attempt++;retry=setTimeout(connect,Math.min(10000,600*Math.pow(1.7,attempt)))};socket.onerror=()=>{try{socket.close()}catch{}}}connect();
window.addEventListener('beforeunload',stopAll);
</script></body></html>
